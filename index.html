<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo — Inicio</title>
<!-- Carga el sistema como las otras dos páginas. Antes tenía su propio <style>
     con la paleta anterior completa, así que la primera pantalla del sitio era
     la única que se veía del producto viejo. -->
<link rel="stylesheet" href="estilo.css?v=5">
<style>
  body{min-height:100vh;box-sizing:border-box;padding:var(--e6) var(--e4);
       display:flex;flex-direction:column;align-items:center;}
  h1{font-family:var(--fuente-reloj);font-weight:300;font-size:var(--d3);margin:0 0 var(--e1);}
  .sub{font-size:var(--t2);color:var(--apagado);margin-bottom:var(--e5);text-align:center;}
  .grid{display:grid;gap:var(--e2);width:100%;max-width:420px;}

  /* Enlace-tarjeta: hereda la superficie del sistema y marca el hover subiendo
     un nivel de fondo, como todo lo demás, en vez de encender un borde. */
  a.tarjeta{display:block;text-decoration:none;color:var(--texto);
    background:var(--sup);border-radius:var(--radio);padding:var(--e3) var(--e4);
    transition:background .15s;}
  a.tarjeta:hover{background:var(--sup-alta);}
  a.tarjeta:focus-visible{outline:2px solid var(--accion);outline-offset:2px;}
  .t{font-size:var(--t4);font-weight:600;margin-bottom:3px;}
  .d{font-size:var(--t2);color:var(--apagado);line-height:1.5;}
  .tag{display:inline-block;font-size:var(--t1);letter-spacing:.1em;text-transform:uppercase;
    font-weight:600;color:var(--rotulo);margin-bottom:var(--e2);}
  .tag.pub{color:var(--campo);background:var(--accion);border-radius:var(--radio-marca);
    padding:2px 7px;}
</style>
</head>
<body>
  <h1>Torneo</h1>
  <div class="sub">Timer y emparejamientos</div>
  <main class="grid">
    <a class="tarjeta" href="admin.html">
      <span class="tag">Solo organizador</span>
      <div class="t">Panel de control</div>
      <div class="d">Timer, emparejamientos, sorteo y calendario en un solo lugar.
        Requiere iniciar sesión.</div>
    </a>
    <a class="tarjeta" href="timer-view.html">
      <span class="tag pub">Jugadores · QR</span>
      <div class="t">Vista de los jugadores</div>
      <div class="d">Cuenta regresiva, mesas, ranking, sorteo y agenda. Sin controles.</div>
    </a>
  </main>
</body>
</html>
