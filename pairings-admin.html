<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emparejamientos — Admin</title>
<style>
  :root{--bg:#161826;--surface:#232532;--text:#e9e9ed;--accent:#9184d9;--divider:rgba(233,233,237,.16);}
  body{margin:0;background:#0e0f18;color:var(--text);font-family:'Inter',system-ui,sans-serif;padding:20px;}
  h1{font-size:18px;font-weight:500;}
  .card{background:var(--surface);border:1px solid var(--divider);border-radius:10px;padding:16px;margin-bottom:14px;max-width:820px;}
  button{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:9px 20px;font-size:14px;cursor:pointer;font-family:inherit;}
  button.sec{border-color:var(--divider);color:var(--text);}
  button:disabled{opacity:.4;cursor:default;}
  input{background:var(--bg);border:1px solid var(--divider);border-radius:6px;color:var(--text);padding:7px 9px;font-size:13px;}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px;}
  td,th{border-bottom:1px solid var(--divider);padding:6px 8px;text-align:left;}
  .muted{font-size:12px;opacity:.6;} .ok{color:#7fd98a;} .err{color:#e05a5a;} .warnc{color:#EF9F27;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  #qr{width:200px;height:200px;background:#fff;padding:8px;border-radius:6px;}
  #panel{display:none;} .center{display:flex;flex-direction:column;align-items:center;}
  .rec{opacity:.6;font-size:11.5px;}
  #drop{border:2px dashed var(--divider);border-radius:12px;padding:34px 16px;text-align:center;
    cursor:pointer;transition:border-color .15s, background .15s;}
  #drop:hover{border-color:var(--accent);}
  #drop.over{border-color:var(--accent);background:rgba(145,132,217,.12);}
  #drop .big{font-size:15.5px;font-weight:500;margin:8px 0 3px;}
  #drop .sm{font-size:12.5px;opacity:.6;}
  #drop .ico{font-size:26px;opacity:.5;line-height:1;}
  #drop.busy{opacity:.55;pointer-events:none;}
  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;opacity:.85;margin-top:10px;cursor:pointer;}
</style>
</head>
<body>
<h1>Emparejamientos — Panel del organizador</h1>

<div class="card" id="loginCard">
  <div class="row">
    <input id="email" type="email" placeholder="correo" autocomplete="username">
    <input id="pass" type="password" placeholder="contraseña" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
  </div>
  <div id="loginMsg" class="muted" style="margin-top:8px"></div>
</div>

<div id="panel">
<div class="card">
  <div style="margin-bottom:8px">Carga el <b>.tdf</b> de TOM (el principal tras guardar, o un respaldo <code>_rN-begin</code> / <code>_rN-end</code>).</div>
  <div id="drop">
    <div class="ico">&#128196;</div>
    <div class="big">Arrastra aquí el archivo .tdf</div>
    <div class="sm">o haz clic para buscarlo en tu computador</div>
  </div>
  <input type="file" id="tdf" accept=".tdf,.xml" style="display:none">
  <label class="chk"><input type="checkbox" id="autoPub"> Publicar automáticamente al soltar el archivo</label>
  <div id="parseMsg" class="muted" style="margin-top:8px"></div>
  <div id="preview"></div>
  <div class="row" style="margin-top:12px">
    <button id="publishBtn" disabled>Publicar a los jugadores</button>
    <span id="pubMsg" class="muted"></span>
  </div>
</div>

<div class="card center">
  <div style="margin-bottom:8px">QR para los jugadores (fijo)</div>
  <img id="qr" alt="QR">
  <div class="row" style="margin-top:8px;width:100%;max-width:460px">
    <input id="shareUrl" readonly style="flex:1">
    <button id="copyBtn" class="sec" style="padding:7px 12px">Copiar</button>
  </div>
</div>
</div>

<script src="config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp(FIREBASE_CONFIG);
const db  = getDatabase(app);
const auth = getAuth(app);
const $ = id => document.getElementById(id);
let parsed = null;

$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = "Entrando…";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch(e){ $("loginMsg").innerHTML='<span class="err">Error: '+e.code+'</span>'; }
};
onAuthStateChanged(auth, u => {
  $("loginCard").style.display = u?"none":"block";
  $("panel").style.display = u?"block":"none";
  if (u){
    const url = location.origin + location.pathname.replace(/pairings-admin\.html?$/,"") + "timer-view.html";
    $("shareUrl").value = url;
    $("qr").src = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(url);
    $("copyBtn").onclick = () => navigator.clipboard?.writeText(url);
  }
});

// Códigos de resultado de TOM
const P1WIN=[1,8], P2WIN=[2,10], TIE=[3], DBLLOSS=[4], BYE=[5];
const label = o => P1WIN.includes(o) ? "Gana J1" : P2WIN.includes(o) ? "Gana J2"
              : TIE.includes(o) ? "Empate" : DBLLOSS.includes(o) ? "Doble derrota"
              : BYE.includes(o) ? "Bye" : "";

function handleFile(f){
  if (!f) return;
  if (!/\.(tdf|xml)$/i.test(f.name)){
    $("parseMsg").innerHTML = '<span class="err">Ese no parece un archivo .tdf</span>';
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      parsed = parseTdf(ev.target.result);
      showPreview(parsed);
      $("publishBtn").disabled = false;
      $("parseMsg").innerHTML = '<span class="ok">' + f.name + ' leído ✓</span>';
      if ($("autoPub").checked) publish();
    } catch(err){
      parsed=null; $("publishBtn").disabled=true;
      $("preview").innerHTML="";
      $("parseMsg").innerHTML = '<span class="err">No pude leer el archivo: '+err.message+'</span>';
    }
  };
  reader.readAsText(f);
}

$("tdf").onchange = e => { handleFile(e.target.files[0]); e.target.value=""; };

const drop = $("drop");
drop.onclick = () => $("tdf").click();
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation(); drop.classList.add("over");
}));
["dragleave","dragend"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation(); drop.classList.remove("over");
}));
drop.addEventListener("drop", e => {
  e.preventDefault(); e.stopPropagation(); drop.classList.remove("over");
  handleFile(e.dataTransfer.files && e.dataTransfer.files[0]);
});
// Evitar que el navegador abra el archivo si se suelta fuera de la zona
["dragover","drop"].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));

function parseTdf(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("XML inválido");
  const name = doc.querySelector("data > name")?.textContent || "Torneo";
  const roundtime = doc.querySelector("data > roundtime")?.textContent || "";

  // IMPORTANTE: solo la lista principal de jugadores tiene nombres.
  // Las listas dentro de <pods> repiten los userid sin nombre y no deben leerse.
  const names = {};
  doc.querySelectorAll("tournament > players > player").forEach(p => {
    const fn = p.querySelector("firstname")?.textContent || "";
    const ln = p.querySelector("lastname")?.textContent || "";
    const full = (fn+" "+ln).trim();
    if (full) names[p.getAttribute("userid")] = full;
  });
  if (!Object.keys(names).length) throw new Error("no encontré la lista de jugadores");

  const rec = {};  // récord acumulado
  Object.keys(names).forEach(id => rec[id] = {w:0,l:0,t:0});
  const snapRec = id => { const r = rec[id]||{w:0,l:0,t:0};
    return { w:r.w, l:r.l, t:r.t, pts: r.w*3 + r.t }; };

  const rounds = [];
  doc.querySelectorAll("pods > pod > rounds > round").forEach(r => {
    const raw = [];
    r.querySelectorAll("matches > match").forEach(m => {
      raw.push({
        out: parseInt(m.getAttribute("outcome")||"0",10),
        p1: m.querySelector("player1")?.getAttribute("userid") || null,
        p2: m.querySelector("player2")?.getAttribute("userid") || null,
        solo: m.querySelector("player")?.getAttribute("userid") || null,
        table: parseInt(m.querySelector("tablenumber")?.textContent||"0",10)
      });
    });
    // El récord mostrado es el que traían ANTES de jugar esta ronda (como en TOM)
    const matches = raw.map(m => ({
      table: m.table,
      p1: names[m.p1 || m.solo] || "?",
      p1rec: snapRec(m.p1 || m.solo),
      p2: m.p2 ? (names[m.p2] || "?") : null,
      p2rec: m.p2 ? snapRec(m.p2) : null,
      result: label(m.out)
    })).sort((a,b)=>a.table-b.table);

    // Ahora sí aplicamos los resultados de esta ronda al acumulado
    raw.forEach(m => {
      const A = rec[m.p1], B = rec[m.p2], S = rec[m.solo];
      if (BYE.includes(m.out) && S) S.w++;
      else if (P1WIN.includes(m.out) && A && B){ A.w++; B.l++; }
      else if (P2WIN.includes(m.out) && A && B){ B.w++; A.l++; }
      else if (TIE.includes(m.out) && A && B){ A.t++; B.t++; }
      else if (DBLLOSS.includes(m.out) && A && B){ A.l++; B.l++; }
    });

    rounds.push({ number: parseInt(r.getAttribute("number"),10), matches });
  });
  if (!rounds.length) throw new Error("el archivo no contiene rondas emparejadas");

  const lastR = rounds[rounds.length-1];
  const pendientes = lastR.matches.filter(m => m.p2 && !m.result).length;
  const phase = pendientes === 0 ? "results" : "paired";

  // Tabla final: usa el orden oficial del TDF si existe; si no, ordena por puntos
  const oficial = [...doc.querySelectorAll('standings pod[type="finished"] player')];
  let standings;
  if (oficial.length){
    standings = oficial.map(p => ({ place: parseInt(p.getAttribute("place"),10),
      name: names[p.getAttribute("id")]||"?", ...snapRec(p.getAttribute("id")) }))
      .sort((a,b)=>a.place-b.place);
  } else {
    standings = Object.keys(names).map(id => ({ name: names[id], ...snapRec(id) }))
      .sort((a,b)=> b.pts-a.pts || b.w-a.w)
      .map((s,i)=>({ place:i+1, ...s }));
  }

  return { name, roundtime, rounds, standings, phase, lastRound: lastR.number,
           pendientes, updatedAt: Date.now() };
}

const recTxt = r => r ? ` (${r.w}-${r.l}-${r.t} · ${r.pts} pts)` : "";

function showPreview(d){
  const last = d.rounds[d.rounds.length-1];
  let html = `<div style="margin-top:10px"><b>${d.name}</b> — se publicará hasta la <b>ronda ${last.number}</b>`;
  if (d.standings.length) html += ` + tabla de posiciones`;
  html += `</div><div style="margin-top:6px;font-size:12.5px">` + (d.phase==="results"
    ? '<span class="ok">Todos los resultados de esta ronda están cargados</span> — los jugadores verán el aviso para revisarlos.'
    : '<span class="warnc">Faltan '+d.pendientes+' resultado(s)</span> — se publicará como ronda en juego.') +
    `</div><table><tr><th>Mesa</th><th>Jugador 1</th><th>Jugador 2</th><th>Resultado</th></tr>`;
  last.matches.forEach(m => {
    html += `<tr><td>${m.p2?m.table:"—"}</td>
      <td>${m.p1}<span class="rec">${recTxt(m.p1rec)}</span></td>
      <td>${m.p2? m.p2+'<span class="rec">'+recTxt(m.p2rec)+'</span>' : "<i>BYE</i>"}</td>
      <td>${m.p2? m.result : "Bye"}</td></tr>`;
  });
  html += `</table>`;
  if (d.standings.length){
    html += `<div style="margin-top:14px;font-size:13px"><b>Posiciones</b></div>
      <table><tr><th>#</th><th>Jugador</th><th>V-D-E</th><th>Puntos</th></tr>`;
    d.standings.forEach(s => {
      html += `<tr><td>${s.place}</td><td>${s.name}</td><td>${s.w}-${s.l}-${s.t}</td><td>${s.pts}</td></tr>`;
    });
    html += `</table>`;
  }
  $("preview").innerHTML = html;
}

async function publish(){
  if (!parsed) return;
  $("pubMsg").textContent = "Publicando…";
  drop.classList.add("busy");
  try {
    await set(ref(db,"pairings"), parsed);
    const hora = new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
    $("pubMsg").innerHTML = '<span class="ok">Publicado ✓ ronda '+parsed.lastRound+' — '+hora+'</span>';
  } catch(e){
    $("pubMsg").innerHTML = '<span class="err">Error: '+(e.code||e.message)+'</span>';
  }
  drop.classList.remove("busy");
}
$("publishBtn").onclick = publish;
</script>
</body>
</html>
