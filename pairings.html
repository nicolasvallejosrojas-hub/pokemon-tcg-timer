<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emparejamientos</title>
<style>
  :root{--bg:#161826;--surface:#232532;--text:#e9e9ed;--accent:#9184d9;--divider:rgba(233,233,237,.16);}
  body{margin:0;background:#0e0f18;color:var(--text);font-family:'Inter',system-ui,sans-serif;padding:16px;}
  h1{font-size:17px;font-weight:500;margin:0 0 2px;}
  .sub{font-size:12px;opacity:.6;margin-bottom:12px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .tabs button{border:1px solid var(--divider);background:transparent;color:var(--text);border-radius:8px;
    padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
  .tabs button.active{border-color:var(--accent);color:var(--accent);}
  input#q{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--divider);
    border-radius:8px;color:var(--text);padding:10px;font-size:15px;margin-bottom:10px;}
  .match{background:var(--surface);border:1px solid var(--divider);border-radius:10px;
    padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
  .table{font-size:20px;font-weight:600;min-width:44px;text-align:center;color:var(--accent);}
  .pl{flex:1;font-size:15px;line-height:1.5;}
  .res{font-size:11px;opacity:.55;white-space:nowrap;}
  .hl{outline:2px solid var(--accent);}
  #status{font-size:13px;opacity:.6;margin-top:20px;text-align:center;}
  .stand{display:flex;gap:12px;padding:8px 12px;border-bottom:1px solid var(--divider);font-size:14px;}
  .stand b{min-width:28px;color:var(--accent);}
</style>
</head>
<body>
<h1 id="tname">Emparejamientos</h1>
<div class="sub" id="tsub"></div>
<input id="q" placeholder="Busca tu nombre…">
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<div id="status">Conectando…</div>

<script src="config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp(FIREBASE_CONFIG);
const db  = getDatabase(app);
const $ = id => document.getElementById(id);
let D = null, sel = null, showStand = false;

onValue(ref(db,"pairings"), snap => {
  D = snap.val();
  if (!D){ $("status").textContent = "Aún no hay emparejamientos publicados."; return; }
  $("status").textContent = "";
  if (sel === null || sel > D.rounds.length) sel = D.rounds.length; // última ronda por defecto
  render();
}, () => $("status").textContent = "Sin conexión — reintentando…");

$("q").oninput = render;

function render(){
  if (!D) return;
  $("tname").textContent = D.name;
  $("tsub").textContent = (D.roundtime? "Rondas de "+D.roundtime+" min · " : "") +
    "Actualizado " + new Date(D.updatedAt).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  const tabs = $("tabs"); tabs.innerHTML = "";
  D.rounds.forEach(r => {
    const b = document.createElement("button");
    b.textContent = "R"+r.number;
    b.className = (!showStand && sel===r.number)?"active":"";
    b.onclick = () => { sel=r.number; showStand=false; render(); };
    tabs.appendChild(b);
  });
  if (D.standings?.length){
    const b = document.createElement("button");
    b.textContent = "Posiciones";
    b.className = showStand?"active":"";
    b.onclick = () => { showStand=true; render(); };
    tabs.appendChild(b);
  }
  const list = $("list"); list.innerHTML = "";
  const q = $("q").value.trim().toLowerCase();
  if (showStand){
    D.standings.forEach(s => {
      const d = document.createElement("div"); d.className="stand";
      if (q && s.name.toLowerCase().includes(q)) d.classList.add("hl");
      d.innerHTML = `<b>${s.place}º</b> <span>${s.name}</span>`;
      list.appendChild(d);
    });
    return;
  }
  const round = D.rounds.find(r => r.number === sel);
  (round?.matches||[]).forEach(m => {
    const d = document.createElement("div"); d.className="match";
    const hit = q && (m.p1.toLowerCase().includes(q) || (m.p2||"").toLowerCase().includes(q));
    if (hit) d.classList.add("hl");
    if (q && !hit) d.style.opacity = .35;
    d.innerHTML = `<div class="table">${m.p2? "M"+m.table : "—"}</div>
      <div class="pl">${m.p1}<br>${m.p2 ?? "<i style='opacity:.6'>BYE (descansa esta ronda)</i>"}</div>
      <div class="res">${m.p2? (m.result||"") : ""}</div>`;
    list.appendChild(d);
  });
}
</script>
</body>
</html>
