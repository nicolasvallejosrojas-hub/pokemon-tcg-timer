<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo — Timer y emparejamientos</title>
<style>
  :root{--text:#e9e9ed;--accent:#9184d9;--divider:rgba(233,233,237,.16);--surface:#232532;}
  html,body{margin:0;height:100%;}
  body{background:#0e0f18;color:var(--text);font-family:'Inter',system-ui,sans-serif;
       overflow:hidden;position:relative;}
  #bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none;transition:opacity .2s;}

  #tabbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;justify-content:center;
    padding:8px;background:rgba(14,15,24,.72);backdrop-filter:blur(6px);border-bottom:1px solid var(--divider);}
  #tabbar button{border:1px solid var(--divider);background:transparent;color:var(--text);border-radius:20px;
    padding:7px 18px;font-size:13.5px;font-family:inherit;cursor:pointer;}
  #tabbar button.on{border-color:var(--accent);color:var(--accent);}
  #dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;visibility:hidden;}

  .page{position:fixed;inset:0;box-sizing:border-box;z-index:1;}
  .page.hide{display:none !important;}

  #pTimer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;
          text-align:center;padding:56px 14px 14px;}
  #logo{max-height:8vh;max-width:60vw;object-fit:contain;display:none;}
  #names{font-size:clamp(15px,3.4vw,26px);opacity:.9;display:none;gap:12px;align-items:baseline;justify-content:center;flex-wrap:wrap;}
  #names .vs{opacity:.45;font-size:.8em;}
  #clock{font-weight:600;line-height:1;font-size:clamp(58px,20vw,210px);font-variant-numeric:tabular-nums;}
  #tstatus{font-size:13px;opacity:.5;min-height:1.3em;}
  .imgbox{position:fixed;z-index:0;pointer-events:none;}
  .imgbox img{width:100%;height:100%;object-fit:contain;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .warn{animation:pulse 1s ease-in-out infinite;}

  #pPair{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:60px 14px 30px;background:#0e0f18;}
  #pClas{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:60px 14px 30px;background:#0e0f18;}
  #mes{background:#1b1d29;color:var(--text);border:1px solid var(--divider);border-radius:8px;
    padding:8px 12px;font-size:14px;font-family:inherit;min-width:180px;}
  #cstatus{text-align:center;opacity:.6;font-size:12.5px;margin-top:14px;}
  #tname{font-size:16px;font-weight:500;margin:0 0 2px;}
  #tsub{font-size:11.5px;opacity:.55;margin-bottom:10px;}
  #q{width:100%;box-sizing:border-box;background:#161826;border:1px solid var(--divider);border-radius:8px;
     color:var(--text);padding:11px;font-size:16px;margin-bottom:10px;}
  #rounds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  #rounds button{border:1px solid var(--divider);background:transparent;color:var(--text);border-radius:8px;
    padding:6px 13px;font-size:13px;font-family:inherit;cursor:pointer;}
  #rounds button.on{border-color:var(--accent);color:var(--accent);}
  .match{background:var(--surface);border:1px solid var(--divider);border-radius:10px;
    padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
  .mesa{font-size:19px;font-weight:600;min-width:44px;text-align:center;color:var(--accent);}
  .pl{flex:1;font-size:15px;line-height:1.5;}
  .res{font-size:11px;opacity:.55;white-space:nowrap;text-align:right;}
  .hl{outline:2px solid var(--accent);}
  #tstand{border-collapse:collapse;width:100%;font-size:14px;}
  #tstand th,#tstand td{border-bottom:1px solid var(--divider);padding:9px 8px;text-align:left;}
  #tstand th{font-weight:500;font-size:12px;opacity:.6;}
  #tstand td:first-child{color:var(--accent);font-weight:600;width:34px;}
  #tstand td:nth-child(3),#tstand td:nth-child(4){white-space:nowrap;opacity:.85;}
  #tstand tr.hlrow td{background:rgba(145,132,217,.18);}
  .rec{opacity:.55;font-size:11.5px;white-space:nowrap;}
  .pts{opacity:.8;font-size:12px;white-space:nowrap;min-width:52px;text-align:right;}
  #pstatus{font-size:13px;opacity:.6;text-align:center;margin-top:26px;}
  .banner{background:rgba(145,132,217,.14);border:1px solid var(--accent);border-radius:8px;
    padding:9px 11px;font-size:12.5px;margin-bottom:10px;line-height:1.45;}
</style>
</head>
<body>
<img id="bg" alt="">

<div id="tabbar">
  <button id="tabT" class="on">Timer</button>
  <button id="tabP">Emparejamientos<span id="dot"></span></button>
  <button id="tabC">Clasificación</button>
</div>

<div class="page" id="pTimer">
  <img id="logo" alt="">
  <div id="names"><span id="n1"></span><span class="vs">vs</span><span id="n2"></span></div>
  <div id="clock">--:--</div>
  <div id="tstatus">Conectando…</div>
</div>

<div class="page hide" id="pClas">
  <h1>Clasificaci&oacute;n</h1>
  <div class="row" style="justify-content:center;margin:6px 0 10px">
    <select id="mes"></select>
  </div>
  <div id="clasBox"></div>
  <div id="cstatus">Conectando&hellip;</div>
</div>

<div class="page hide" id="pPair">
  <h1 id="tname">Emparejamientos</h1>
  <div id="tsub"></div>
  <div id="banner" class="banner" style="display:none"></div>
  <input id="q" placeholder="Busca tu nombre…">
  <div id="rounds"></div>
  <div id="list"></div>
  <div id="pstatus">Conectando…</div>
</div>

<script src="config.js">
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp(FIREBASE_CONFIG);
const db  = getDatabase(app);
const $ = id => document.getElementById(id);

const slug = v => (v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
                   .replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,24);
const SALA = slug(new URLSearchParams(location.search).get("sala")) || "principal";
const BASE = "salas/" + SALA;

let tab = "timer";
function show(t){
  tab = t;
  $("pTimer").classList.toggle("hide", t!=="timer");
  $("pPair").classList.toggle("hide", t!=="pair");
  $("pClas").classList.toggle("hide", t!=="clas");
  $("tabT").classList.toggle("on", t==="timer");
  $("tabP").classList.toggle("on", t==="pair");
  $("tabC").classList.toggle("on", t==="clas");
  document.querySelectorAll(".imgbox").forEach(e => e.style.display = t==="timer" ? "block" : "none");
  $("bg").style.opacity = t==="timer" ? "1" : "0";
  if (t==="pair"){ $("dot").style.visibility="hidden"; seenStamp = P?.updatedAt || 0; }
}
$("tabT").onclick = () => show("timer");
$("tabP").onclick = () => show("pair");
$("tabC").onclick = () => show("clas");

let S = null, TH = null, offset = 0;
onValue(ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; });

// El reloj llega por su propio canal (paquete diminuto = respuesta inmediata)
onValue(ref(db, BASE + "/timer/state"), snap => {
  S = snap.val();
  $("tstatus").textContent = S ? "" : "Esperando al organizador…";
}, () => $("tstatus").textContent = "Sin conexión — reintentando…");

// La apariencia llega aparte y solo cuando el organizador la cambia
onValue(ref(db, BASE + "/timer/theme"), snap => { TH = snap.val(); applyTheme(); });


function vistaActual(){
  return (window.innerHeight >= window.innerWidth) ? "mobile" : "desktop";
}

function applyTheme(){
  if (!TH) return;
  const modo = vistaActual();
  const V = TH[modo] || TH.desktop || TH;      // compatible con el formato anterior
  const DIM = modo === "mobile" ? {w:620,h:1100} : {w:1180,h:660};

  if (V.bgType === "image" && V.bgImage){
    $("bg").src = V.bgImage; $("bg").style.display = "block";
    $("bg").style.filter = `opacity(${V.bgOpacity??100}%) brightness(${V.bgBrightness??100}%)`;
    document.body.style.background = "#0e0f18";
  } else {
    $("bg").style.display = "none";
    document.body.style.background = V.bgType === "gradient"
      ? `linear-gradient(${V.bgDir||"to right"}, ${V.bgColor1||"#161826"}, ${V.bgColor2||"#2b2741"})`
      : (V.bgColor1 || "#161826");
  }

  if (TH.logo){ $("logo").src = TH.logo; $("logo").style.display = "block"; }
  else $("logo").style.display = "none";
  $("names").style.display = "none";

  document.querySelectorAll(".imgbox").forEach(e => e.remove());
  (V.boxes || V.imgBoxes || []).forEach(box => {
    if (!box.src) return;
    const d = document.createElement("div"); d.className = "imgbox";
    d.style.left   = (box.x / DIM.w * 100) + "vw";
    d.style.top    = (box.y / DIM.h * 100) + "vh";
    d.style.width  = (box.w / DIM.w * 100) + "vw";
    d.style.height = (box.h / DIM.h * 100) + "vh";
    d.style.display = tab === "timer" ? "block" : "none";
    const im = document.createElement("img"); im.src = box.src;
    if (box.flip) im.style.transform = "scaleX(-1)";
    d.appendChild(im); document.body.appendChild(d);
  });
}
window.addEventListener("resize", () => { if (TH) applyTheme(); });
window.addEventListener("orientationchange", () => setTimeout(() => { if (TH) applyTheme(); }, 300));

function fmt(sec){ const n=sec<0,a=Math.abs(sec);
  return (n?"-":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0"); }

function tick(){
  if (S){
    const sec = (S.paused || !S.endTime) ? Math.round(S.remaining??0)
                                         : Math.round((S.endTime-(Date.now()+offset))/1000);
    const c = $("clock");
    c.textContent = fmt(sec);
    c.style.color = sec<0 ? (S.negativeColor||"#e05a5a") : (S.timerColor||"#e9e9ed");
    c.classList.toggle("warn", !S.paused && sec<=10 && sec>=0);
    if (S.timerSize) c.style.fontSize = "min(" + S.timerSize + "px, 26vw)";
  }
  requestAnimationFrame(tick);
}
tick();

let P = null, sel = null, showStand = false, seenStamp = 0, first = true;
onValue(ref(db, BASE + "/pairings"), snap => {
  P = snap.val();
  if (!P){ $("pstatus").textContent = "Aún no hay emparejamientos publicados."; return; }
  $("pstatus").textContent = "";
  const lastNum = P.rounds[P.rounds.length-1].number;
  if (sel === null || sel < lastNum) sel = lastNum;
  if (!first && tab !== "pair" && P.updatedAt > seenStamp) $("dot").style.visibility = "visible";
  first = false;
  renderPair();
}, () => $("pstatus").textContent = "Sin conexión — reintentando…");

$("q").oninput = renderPair;

function renderPair(){
  if (!P) return;
  $("tname").textContent = P.name;
  $("tsub").textContent = (P.roundtime? "Rondas de "+P.roundtime+" min · ":"") +
    "Actualizado " + new Date(P.updatedAt).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});

  const b = $("banner");
  if (P.phase === "results"){
    b.style.display="block";
    b.textContent = "Resultados de la ronda "+P.lastRound+" publicados. Revisa que el tuyo esté correcto y avisa al juez si hay algún error.";
  } else if (P.phase === "paired"){
    b.style.display="block";
    b.textContent = "Ronda "+P.lastRound+" emparejada. Busca tu mesa.";
  } else b.style.display="none";

  const rb = $("rounds"); rb.innerHTML="";
  P.rounds.forEach(r => {
    const btn=document.createElement("button");
    btn.textContent="R"+r.number;
    btn.className=(!showStand && sel===r.number)?"on":"";
    btn.onclick=()=>{sel=r.number;showStand=false;renderPair();};
    rb.appendChild(btn);
  });
  if (P.standings?.length){
    const btn=document.createElement("button");
    btn.textContent="Posiciones"; btn.className=showStand?"on":"";
    btn.onclick=()=>{showStand=true;renderPair();};
    rb.appendChild(btn);
  }

  const list=$("list"); list.innerHTML="";
  const q=$("q").value.trim().toLowerCase();
  if (showStand){
    let h = `<table id="tstand"><tr><th>#</th><th>Jugador</th><th>V-D-E</th><th>Puntos</th></tr>`;
    P.standings.forEach(s=>{
      const hit = q && s.name.toLowerCase().includes(q);
      h += `<tr${hit?' class="hlrow"':''}><td>${s.place}</td><td>${s.name}</td>
            <td>${s.w}-${s.l}-${s.t}</td><td>${s.pts}</td></tr>`;
    });
    list.innerHTML = h + `</table>`;
    return;
  }
  const round=P.rounds.find(r=>r.number===sel);
  (round?.matches||[]).forEach(m=>{
    const d=document.createElement("div"); d.className="match";
    const hit=q && (m.p1.toLowerCase().includes(q) || (m.p2||"").toLowerCase().includes(q));
    if (hit) d.classList.add("hl");
    if (q && !hit) d.style.opacity=.35;
    const line = (n,r) => n ? n + (r ? `<span class="rec"> ${r.w}-${r.l}-${r.t} · ${r.pts} pts</span>` : "") : "";
    d.innerHTML=`<div class="mesa">${m.p2? "M"+m.table : "—"}</div>
      <div class="pl">${line(m.p1,m.p1rec)}<br>${m.p2 ? line(m.p2,m.p2rec) : "<i style='opacity:.6'>BYE (descansa)</i>"}</div>
      <div class="res">${m.p2? (m.result||"") : ""}</div>`;
    list.appendChild(d);
  });
}

try { navigator.wakeLock?.request("screen").catch(()=>{}); } catch(e){}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState==="visible"){ try{ navigator.wakeLock?.request("screen").catch(()=>{});}catch(e){} }
});

/* ================= CLASIFICACIÓN MENSUAL ================= */
const esc = t => String(t==null?"":t).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

let HIST = null, CFG = { puntos:[12,10,8,7,6,5,4,3], resto:1 }, mesSel = null;

onValue(ref(db, BASE + "/config"), snap => {
  const v = snap.val();
  if (v && Array.isArray(v.puntos)) CFG = { puntos: v.puntos, resto: v.resto ?? 1 };
  renderClas();
});
onValue(ref(db, BASE + "/historial"), snap => { HIST = snap.val() || {}; renderClas(); },
        () => { $("cstatus").textContent = "No se pudo cargar la clasificaci\u00f3n."; });

function puntosPorPuesto(place){
  const p = CFG.puntos;
  return (place >= 1 && place <= p.length) ? p[place-1] : (CFG.resto || 0);
}

$("mes").onchange = e => { mesSel = e.target.value; renderClas(true); };

function renderClas(soloTabla){
  if (!HIST) return;
  const torneos = Object.values(HIST);
  if (!torneos.length){
    $("clasBox").innerHTML = "";
    $("cstatus").textContent = "Todav\u00eda no hay torneos archivados.";
    $("mes").style.display = "none";
    return;
  }
  $("mes").style.display = "";

  const meses = [...new Set(torneos.map(t => t.mes))].sort().reverse();
  if (!mesSel || !meses.includes(mesSel)) mesSel = meses[0];
  if (!soloTabla){
    $("mes").innerHTML = meses.map(m =>
      '<option value="'+m+'"'+(m===mesSel?' selected':'')+'>'+nombreMes(m)+'</option>').join("");
  }

  const delMes = torneos.filter(t => t.mes === mesSel);
  const tabla = {};
  delMes.forEach(t => (t.standings||[]).forEach(p => {
    const k = p.name;
    if (!tabla[k]) tabla[k] = { name:p.name, pts:0, torneos:0, mejor:99, w:0, l:0, e:0 };
    const r = tabla[k];
    r.pts += puntosPorPuesto(p.place);
    r.torneos++;
    r.mejor = Math.min(r.mejor, p.place);
    r.w += p.w||0; r.l += p.l||0; r.e += p.t||0;
  }));

  const filas = Object.values(tabla)
    .sort((a,b) => b.pts - a.pts || a.mejor - b.mejor || b.w - a.w || a.name.localeCompare(b.name));

  let h = '<div class="sub" style="margin-bottom:8px">' + delMes.length +
          (delMes.length === 1 ? ' torneo' : ' torneos') + ' en ' + nombreMes(mesSel) + '</div>';
  h += '<table id="tstand"><tr><th>#</th><th>Jugador</th><th>Torneos</th><th>Mejor</th><th>Puntos</th></tr>';
  filas.forEach((r,i) => {
    h += '<tr><td>' + (i+1) + '</td><td>' + esc(r.name) + '</td><td>' + r.torneos +
         '</td><td>' + r.mejor + '\u00ba</td><td><b>' + r.pts + '</b></td></tr>';
  });
  h += '</table>';
  $("clasBox").innerHTML = h;
  $("cstatus").textContent = "";
}

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio",
               "agosto","septiembre","octubre","noviembre","diciembre"];
function nombreMes(m){
  const [a,mm] = m.split("-");
  return MESES[parseInt(mm,10)-1] + " " + a;
}


</script>
</body>
</html>
