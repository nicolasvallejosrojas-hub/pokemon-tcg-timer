<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo — Timer y emparejamientos</title>
<link rel="stylesheet" href="estilo.css?v=2">
<style>
  /* Lo compartido vive en estilo.css. Acá queda solo el acomodo de esta
     página: el reloj a pantalla completa, la rejilla de mesas y las tarjetas.
     Las medidas de los componentes comunes se ajustan con variables. */
  :root{--text:var(--texto);--accent:var(--accion);
        --divider:rgba(244,240,245,.10);--surface:var(--sup);
        --cal-alto:46px;--rueda:min(86vw,420px);}

  html,body{height:100%;}
  body{overflow:hidden;position:relative;}
  #bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;
      display:none;transition:opacity .2s;}
  .page{position:fixed;inset:0;box-sizing:border-box;z-index:1;}
  .page.hide{display:none !important;}
  .sub{font-size:12.5px;color:var(--apagado);}

  /* =========================================================
     Barra inferior de 5 iconos
     Cinco pestañas con texto no caben a 375 px. Abajo y con icono se llega
     con el pulgar, que es como el jugador sostiene el teléfono mientras
     tiene el mazo en la otra mano.
     ========================================================= */
  #tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;
    background:rgba(42,36,47,.94);backdrop-filter:blur(10px);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));}
  #tabbar button{flex:1;border:none;background:transparent;color:var(--rotulo);
    font-family:inherit;cursor:pointer;padding:6px 2px 4px;display:flex;
    flex-direction:column;align-items:center;gap:3px;border-radius:var(--radio);
    position:relative;min-width:0;}
  #tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  #tabbar button span{font-size:10.5px;font-weight:500;letter-spacing:.01em;}
  #tabbar button.on{color:var(--accion);}
  #dot{position:absolute;top:4px;right:calc(50% - 17px);width:7px;height:7px;
    border-radius:50%;background:var(--accion);visibility:hidden;}

  /* Las páginas con scroll dejan sitio para la barra de abajo. El timer NO:
     ahí la cabecera y la línea de estado se posicionan aparte, para que el
     reloj quede centrado en la pantalla completa. Con padding-bottom quedaba
     59 px más arriba del centro. */
  #pPair,#pClas,#pSort,#pAgenda{padding-bottom:76px;}

  /* =========================================================
     Timer
     ========================================================= */
  #pTimer{display:flex;align-items:center;justify-content:center;
          text-align:center;padding:0 14px;}
  #relojGrupo{display:flex;flex-direction:column;align-items:center;gap:1.6vh;
              max-width:100%;}
  /* Mismo rótulo que el lienzo de la tienda: espaciado y en mayúsculas, para
     que se lea "en qué vamos" sin competir con el número. */
  #pronda{font-size:clamp(11px,3.2vw,15px);letter-spacing:.22em;text-transform:uppercase;
    color:var(--apagado);text-shadow:0 1px 3px rgba(0,0,0,.85);display:none;}
  /* La cabecera va arriba a la izquierda y no estorba al reloj, que sigue
     centrado en la pantalla completa. */
  #cabecera{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
    gap:11px;padding:14px 16px;text-align:left;min-width:0;}
  #logo{max-height:38px;max-width:38vw;object-fit:contain;display:none;flex-shrink:0;}
  #cabtxt{min-width:0;}
  #ctitulo{font-size:15px;font-weight:600;line-height:1.25;overflow-wrap:anywhere;
    text-shadow:0 1px 3px rgba(0,0,0,.85);}
  #csub{font-size:12px;color:var(--apagado);margin-top:2px;line-height:1.25;
    text-shadow:0 1px 3px rgba(0,0,0,.85);}
  #names{display:none;}
  #clock{font-size:clamp(64px,22vw,220px);}
  #tstatus{position:absolute;left:0;right:0;bottom:88px;font-size:13px;
           color:var(--apagado);min-height:1.3em;text-shadow:0 1px 3px rgba(0,0,0,.85);}
  .imgbox{position:fixed;z-index:0;pointer-events:none;}
  .imgbox img{width:100%;height:100%;object-fit:contain;}

  /* =========================================================
     Emparejamientos
     ========================================================= */
  #pPair{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 76px;
         background:var(--pagina);}
  #tname{font-family:var(--fuente-reloj);font-weight:300;font-size:27px;margin:0 0 2px;}
  #tsub{font-size:12px;color:var(--rotulo);margin-bottom:14px;}
  .banner{background:var(--sup);border-left:3px solid var(--accion);
    border-radius:var(--radio);padding:11px 14px;font-size:13px;margin-bottom:14px;
    line-height:1.5;}

  /* El buscador es lo primero que toca el jugador, por eso va grande */
  #q{width:100%;font-size:16px;padding:14px 16px;margin-bottom:14px;}

  #rounds{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
  #rounds button{border:none;background:var(--sup);color:var(--apagado);
    border-radius:var(--radio);padding:8px 15px;font-size:13.5px;
    font-family:inherit;cursor:pointer;}
  #rounds button.on{background:var(--accion);color:var(--campo);font-weight:600;}

  /* Las mesas van de a dos: el jugador escanea, no lee */
  #list.mesas{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start;}
  @media (min-width:1100px){ #list.mesas{grid-template-columns:1fr 1fr 1fr;} }
  .match{background:var(--sup);border-radius:var(--radio);overflow:hidden;
    display:flex;flex-direction:column;}
  .match.hl{box-shadow:inset 0 0 0 2px var(--accion);}
  .mnum{display:flex;align-items:baseline;justify-content:center;gap:6px;
    padding:5px 8px;background:var(--campo);}
  .mlbl{font-size:9px;letter-spacing:.14em;color:var(--rotulo);font-weight:600;}
  .mval{font-size:17px;font-weight:700;color:var(--accion);
        font-variant-numeric:tabular-nums;}
  .mbody{flex:1;display:flex;flex-direction:column;gap:7px;padding:11px 12px;}
  .prow{display:flex;align-items:center;gap:8px;}
  .pinfo{flex:1;min-width:0;}
  /* A 375 px con dos columnas el nombre y el récord se parten feo. Se achican
     lo justo para que la mayoría entre en una línea; el récord no se parte
     nunca, se recorta, porque leerlo a medias confunde más que no verlo. */
  .pname{font-size:13.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;}
  .pmeta{font-size:11px;color:var(--apagado);margin-top:3px;
         font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;}
  .mbody{padding:10px;}
  .win,.tie{font-size:8.5px;padding:3px 6px;}
  .prow.won .pname{color:var(--accion);}
  .win,.tie{font-size:9px;letter-spacing:.1em;font-weight:700;padding:3px 7px;
    border-radius:2px;white-space:nowrap;}
  .win{background:var(--accion);color:var(--campo);}
  .tie{background:var(--sup-alta);color:var(--apagado);}
  .byetag{font-size:12px;color:var(--apagado);}
  .byetag b{color:var(--texto);}

  .secLabel,.chead{font-size:10px;letter-spacing:.12em;color:var(--rotulo);
    font-weight:600;padding:0 2px 10px;display:flex;justify-content:space-between;}
  .frow,.crow{display:flex;align-items:center;gap:12px;padding:12px 10px;
    background:var(--sup);border-radius:var(--radio);margin-bottom:5px;}
  .hlrow{box-shadow:inset 0 0 0 2px var(--accion);}
  .fmid{flex:1;min-width:0;}

  /* =========================================================
     Clasificación
     ========================================================= */
  #pClas{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 76px;
         background:var(--pagina);}
  #pClas h1,#rTitle,#aTitle{font-family:var(--fuente-reloj);font-weight:300;
    font-size:27px;margin:0 0 12px;}
  #mes{min-width:190px;font-size:14px;}
  #cstatus,#sstatus,#astatus,#pstatus{text-align:center;color:var(--apagado);
    font-size:12.5px;margin-top:16px;}
  .crow{cursor:pointer;}
  .crow.sel{box-shadow:inset 0 0 0 2px var(--accion);}
  .cdet{display:none;gap:22px;margin:-3px 0 5px;padding:12px 14px;
    background:var(--campo);border-radius:var(--radio);}
  .cdet.open{display:flex;}
  .cdet span{display:block;font-size:10px;letter-spacing:.1em;color:var(--rotulo);
    font-weight:600;}
  .cdet b{font-size:15px;font-weight:600;}
  .cdet b.ac{color:var(--accion);}
  .chint{font-size:12px;color:var(--rotulo);padding:14px 4px 0;text-align:center;}

  /* Podio del top 3. El primero va al centro y más alto, como en un podio de
     verdad; el orden en pantalla es 2 · 1 · 3. Los colores salen de la paleta
     (oro, plata, bronce del sistema) y no del rojo y verde de la referencia,
     que pelearían con el amarillo de acción. */
  #podio{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:7px;align-items:end;
         margin:4px 0 22px;position:relative;padding-bottom:5px;}
  /* Una base para que los tres bloques se apoyen en algo y no floten */
  #podio::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
    background:var(--sup-alta);border-radius:0 0 var(--radio) var(--radio);}
  .pod{display:flex;flex-direction:column;align-items:center;min-width:0;}
  .podNom{font-size:12.5px;font-weight:600;text-align:center;line-height:1.25;
    margin-bottom:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow-wrap:anywhere;}
  .podPts{font-size:11.5px;color:var(--apagado);margin-bottom:7px;
    font-variant-numeric:tabular-nums;white-space:nowrap;}
  .podCaja{width:100%;border-radius:var(--radio) var(--radio) 0 0;display:flex;
    align-items:center;justify-content:center;font-family:var(--fuente-reloj);
    font-weight:300;color:var(--campo);line-height:1;}
  .p1 .podCaja{height:104px;background:var(--podio1);font-size:42px;}
  .p2 .podCaja{height:76px; background:var(--podio2);font-size:34px;}
  .p3 .podCaja{height:58px; background:var(--podio3);font-size:30px;}
  /* Con uno o dos jugadores el podio se ve raro, así que ahí no se muestra */
  #podio.hide{display:none;}

  /* =========================================================
     Sorteo
     ========================================================= */
  #pSort{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 76px;
    background:var(--pagina);display:flex;flex-direction:column;align-items:center;}
  #rList{width:100%;max-width:420px;margin-top:20px;}

  /* =========================================================
     Agenda
     ========================================================= */
  #pAgenda{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 76px;
           background:var(--pagina);}
  .evCard{background:var(--sup);border-radius:var(--radio);padding:14px;
    margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;}
  .evCard.prox{box-shadow:inset 0 0 0 2px var(--accion);}
  .evCard.destacada{box-shadow:inset 0 0 0 2px var(--accion-clara);}
  .evCal{min-width:52px;text-align:center;flex-shrink:0;}
  .evCal .d{font-family:var(--fuente-reloj);font-weight:300;font-size:32px;
            line-height:1;font-variant-numeric:tabular-nums;}
  .evCal .m{font-size:10px;letter-spacing:.1em;color:var(--rotulo);font-weight:600;
            margin-top:2px;}
  .evBody{flex:1;min-width:0;}
  .evTit{font-size:16px;font-weight:600;line-height:1.3;}
  .evCuando{font-size:12.5px;color:var(--apagado);margin-top:4px;line-height:1.5;}
  .evFalta{display:inline-block;font-size:10px;letter-spacing:.08em;font-weight:700;
    color:var(--campo);background:var(--accion);border-radius:2px;padding:3px 8px;
    margin-top:8px;text-transform:uppercase;}
  .evDet{font-size:12.5px;color:var(--apagado);margin-top:8px;line-height:1.5;
         white-space:pre-wrap;}
  .evBtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  /* Sobre la tarjeta (--sup) el botón necesita ser --sup-alta o se pierde */
  .evBtns a,.evBtns button{border:none;background:var(--sup-alta);color:var(--texto);
    border-radius:var(--radio);padding:9px 14px;font-size:12.5px;font-family:inherit;
    cursor:pointer;text-decoration:none;white-space:nowrap;}
  .evBtns a.gcal{background:var(--accion);color:var(--campo);font-weight:600;}
  #calCaja{margin-bottom:20px;}
</style>
</head>
<body>

<!-- ============ Fondo y barra de pestañas ============ -->
<img id="bg" alt="">

<!-- Barra abajo: cinco pestañas con texto no caben a 375 px, y abajo se
     llega con el pulgar mientras la otra mano sostiene el mazo. -->
<div id="tabbar">
  <button id="tabT" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>Timer</span></button>
  <button id="tabP"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7.5" height="7"/><rect x="13.5" y="4" width="7.5" height="7"/><rect x="3" y="13" width="7.5" height="7"/><rect x="13.5" y="13" width="7.5" height="7"/></svg><span>Mesas</span><i id="dot"></i></button>
  <button id="tabC"><svg viewBox="0 0 24 24"><path d="M9 20V10M15 20V4M3 20h18M21 20v-6"/></svg><span>Ranking</span></button>
  <button id="tabS"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 5v16M4 13h16M6.3 7.3l11.4 11.4M17.7 7.3L6.3 18.7"/></svg><span>Sorteo</span></button>
  <button id="tabA"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Agenda</span></button>
</div>

<!-- ============ Timer ============ -->
<div class="page" id="pTimer">
  <!-- Misma cabecera que la pantalla de la tienda, sin los botones de control
       ni el rótulo de "solo organizador", que ahí no significan nada. -->
  <div id="cabecera">
    <img id="logo" alt="">
    <div id="cabtxt">
      <div id="ctitulo"></div>
      <div id="csub"></div>
    </div>
  </div>
  <div id="names"><span id="n1"></span><span class="vs">vs</span><span id="n2"></span></div>
  <!-- Rótulo y reloj van juntos en un grupo, y ese grupo es lo que se centra:
       si se centrara solo el reloj, el rótulo lo empujaría hacia abajo. -->
  <div id="relojGrupo">
    <div id="pronda"></div>
    <div id="clock" class="reloj">--:--</div>
  </div>
  <div id="tstatus">Conectando…</div>
</div>

<!-- ============ Emparejamientos ============ -->
<div class="page hide" id="pPair">
  <h1 id="tname">Emparejamientos</h1>
  <div id="tsub"></div>
  <div id="banner" class="banner" style="display:none"></div>
  <input id="q" placeholder="Escribe tu nombre">
  <div id="rounds"></div>
  <div id="list"></div>
  <div id="pstatus">Conectando…</div>
</div>

<!-- ============ Clasificación mensual ============ -->
<div class="page hide" id="pClas">
  <h1>Ranking</h1>
  <div class="row" style="justify-content:center;margin:6px 0 10px">
    <select id="mes"></select>
  </div>
  <div id="podio" class="hide"></div>
  <div id="clasBox"></div>
  <div id="cstatus">Conectando&hellip;</div>
</div>

<!-- ============ Sorteo ============ -->
<div class="page hide" id="pSort">
  <h1 id="rTitle">Sorteo</h1>
  <div id="rVacio" class="vacio" style="display:none">
    <b>Todav&iacute;a no hay sorteo</b>
    <div>Cuando el organizador lo prepare, la rueda aparece ac&aacute; sola.</div>
  </div>
  <div id="rWrap">
    <canvas id="rCanvas" width="440" height="440"></canvas>
    <div id="rPin"></div>
  </div>
  <div id="rWinner"></div>
  <div id="rList"></div>
  <div id="sstatus"></div>
</div>

<!-- ============ Agenda de torneos ============ -->
<div class="page hide" id="pAgenda">
  <h1 id="aTitle">Pr&oacute;ximos torneos</h1>

  <div id="calCaja" style="display:none;margin-bottom:20px">
    <div id="calNav">
      <div id="calMes">&nbsp;</div>
      <button id="calHoy">Hoy</button>
      <button id="calAnt" aria-label="Mes anterior">&lsaquo;</button>
      <button id="calSig" aria-label="Mes siguiente">&rsaquo;</button>
    </div>
    <div class="calGrid" id="calDows"></div>
    <div class="calGrid" id="calGrid"></div>
  </div>

  <div id="aVacio" class="vacio" style="display:none">
    <b>No hay fechas publicadas</b>
    <div>Cuando el organizador agende el pr&oacute;ximo torneo, aparece ac&aacute;.</div>
  </div>
  <div id="aLista"></div>
  <div id="astatus">Cargando&hellip;</div>
</div>

<script src="config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, get, goOffline, goOnline } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { estaVigente, urlGoogle, bajarIcs, fechaLegible, cuantoFalta, ordenar,
         MES_LARGO, DOWS, mesDesplazado, celdasDelMes, porFecha, mesDeInteres } from "./agenda.js?v=3";

/* =========================================================
   1. Arranque: Firebase, sala y utilidades
   ========================================================= */
const app = initializeApp(FIREBASE_CONFIG);
const db  = getDatabase(app);
const $ = id => document.getElementById(id);

const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const slug = v => (v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
                   .replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,24);

const SALA = slug(new URLSearchParams(location.search).get("sala")) || "principal";
const BASE = "salas/" + SALA;

/* El empate vale media victoria, igual que en el sistema oficial */
const pctTxt = r => {
  const j = (r.w||0) + (r.l||0) + (r.t||0);
  return j ? " · " + Math.round(((r.w||0) + (r.t||0)/2) / j * 100) + "%" : "";
};

let offset = 0;                                   // diferencia con la hora del servidor
const ahora = () => Date.now() + offset;
onValue(ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; });

/* =========================================================
   2. Navegación entre pestañas
   ========================================================= */
/* Una entrada por pestaña: página, botón y qué hay que despertar al abrirla.
   Las pestañas pesadas (clasificación, agenda) recién se suscriben a Firebase
   cuando alguien las abre, así entrar al timer no descarga nada de más. */
let tab = "timer";
const PAGINAS = {
  timer:  ["pTimer",  "tabT", null],
  pair:   ["pPair",   "tabP", () => { $("dot").style.visibility = "hidden"; seenStamp = P?.updatedAt || 0; }],
  clas:   ["pClas",   "tabC", () => suscribirHistorial()],
  sorteo: ["pSort",   "tabS", () => pintarRuleta()],
  agenda: ["pAgenda", "tabA", () => suscribirAgenda()]
};
function show(t){
  tab = t;
  for (const [k, [pagina, boton]] of Object.entries(PAGINAS)){
    $(pagina).classList.toggle("hide", k !== t);
    $(boton).classList.toggle("on", k === t);
  }
  document.querySelectorAll(".imgbox").forEach(e => e.style.display = t==="timer" ? "block" : "none");
  $("bg").style.opacity = t==="timer" ? "1" : "0";
  // Con cinco pestañas la barra ya no cabe entera en un celular angosto: la
  // que se abre se trae a la vista sola, para que no quede a medias en el borde.
  $(PAGINAS[t][1]).scrollIntoView({ behavior:"smooth", block:"nearest", inline:"nearest" });
  PAGINAS[t][2]?.();
}
Object.entries(PAGINAS).forEach(([k, [, boton]]) => $(boton).onclick = () => show(k));

/* =========================================================
   3. Respaldo local
   El reloj y el diseño quedan guardados en el propio teléfono. Si el jugador
   recarga la página sin señal, la vista igual aparece y el reloj sigue
   correcto, porque lo que guardamos es la HORA DE TÉRMINO, no los segundos
   que faltaban.
   ========================================================= */
let S = null, TH = null;

const RK = "tv-back-" + SALA;
try {
  const b = JSON.parse(localStorage.getItem(RK) || "null");
  if (b){ S = b.S || null; TH = b.TH || null; }
} catch(e){}

let backTimer = null, backupWarned = false;
function guardarRespaldo(){
  clearTimeout(backTimer);
  backTimer = setTimeout(() => {
    try { localStorage.setItem(RK, JSON.stringify({ S, TH })); }
    catch(e){ if (!backupWarned){ backupWarned = true; console.warn("Respaldo local no disponible:", e); } }
  }, 500);
}

/* =========================================================
   4. Conexión
   ========================================================= */
onValue(ref(db, ".info/connected"), s => {
  const online = s.val() === true;
  $("tstatus").textContent = online ? (S ? "" : "Esperando al organizador…")
                                    : (S ? "Sin conexión — mostrando lo último recibido" : "Sin conexión…");
});

/* Soltar la conexión cuando el teléfono se bloquea o se cambia de app.
   El reloj sigue andando solo porque conoce la hora exacta de término. */
let dormirTimer = null;
document.addEventListener("visibilitychange", () => {
  clearTimeout(dormirTimer);
  if (document.hidden){
    dormirTimer = setTimeout(() => { try { goOffline(db); } catch(e){} }, 20000);
  } else {
    // Se reconecta siempre al volver: si el teléfono cortó la conexión por su
    // cuenta, goOnline es inofensivo y evita quedarse mirando datos viejos.
    try { goOnline(db); } catch(e){}
  }
});

/* =========================================================
   5. Reloj
   Llega por su propio canal (paquete diminuto = respuesta inmediata).
   ========================================================= */
onValue(ref(db, BASE + "/timer/state"), snap => {
  S = snap.val();
  $("tstatus").textContent = S ? "" : "Esperando al organizador…";
  guardarRespaldo();
  dibujarReloj();
}, () => $("tstatus").textContent = "Sin conexión — reintentando…");

function fmt(sec){
  const n = sec < 0, a = Math.abs(sec);
  return (n?"-":"") + String(Math.floor(a/60)).padStart(2,"0") + ":" + String(a%60).padStart(2,"0");
}

function dibujarReloj(){
  if (!S) return;
  const sec = (S.paused || !S.endTime) ? Math.round(S.remaining ?? 0)
                                       : Math.round((S.endTime - ahora())/1000);
  const c = $("clock");
  c.textContent = fmt(sec);
  c.style.color = sec < 0 ? (S.negativeColor||"#e05a5a") : (S.timerColor||"#e9e9ed");
  const porVencer = !S.paused && sec <= 10 && sec >= 0;
  c.classList.toggle("porvencer", porVencer);
  c.classList.toggle("pulsing", porVencer);
  c.classList.toggle("pausado", !!S.paused);
  if (S.timerSize) c.style.fontSize = "min(" + S.timerSize + "px, 26vw)";
}

/* Antes esto giraba con requestAnimationFrame y ahí estaba el bug del reloj
   detenido: basta que el navegador congele los frames al bloquear la pantalla
   (o que se escape una excepción) para que el bucle no se vuelva a pedir nunca
   más y el número quede clavado. Un intervalo no se muere, y como el reloj
   muestra segundos enteros nadie nota la diferencia. */
setInterval(() => { try { dibujarReloj(); } catch(e){} }, 250);

// Al volver a primer plano se redibuja de inmediato, sin esperar el intervalo
["visibilitychange","pageshow","focus","online"].forEach(ev =>
  window.addEventListener(ev, () => { try { dibujarReloj(); } catch(e){} }));

/* Mantener la pantalla encendida mientras corre la ronda */
const pedirWakeLock = () => { try { navigator.wakeLock?.request("screen").catch(()=>{}); } catch(e){} };
pedirWakeLock();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") pedirWakeLock();
});

/* =========================================================
   6. Diseño e imágenes
   "theme" es liviano y llega en vivo con cada cambio. Las imágenes son
   pesadas: se guardan en el propio celular y solo se vuelven a descargar si
   el organizador cambia alguna de verdad.
   ========================================================= */
const CK = "tv-media-" + SALA;
let MED = null, medVer = null;

try {
  const c = JSON.parse(localStorage.getItem(CK) || "null");
  if (c && c.m){ MED = c.m; medVer = c.v; }
} catch(e){}

onValue(ref(db, BASE + "/timer/theme"), snap => { TH = snap.val(); applyTheme(); guardarRespaldo(); });

async function bajarMedia(v){
  try {
    const s = await get(ref(db, BASE + "/timer/media"));
    MED = s.val(); medVer = v; applyTheme();
    try { localStorage.setItem(CK, JSON.stringify({ v, m: MED })); } catch(e){}
  } catch(e){}
}
onValue(ref(db, BASE + "/timer/mediaVersion"), s => {
  const v = s.val();
  if (v == null) return;                          // panel antiguo: las imágenes venían dentro del theme
  if (v === medVer && MED){ applyTheme(); return; }
  bajarMedia(v);
});

const vistaActual = () => (window.innerHeight >= window.innerWidth) ? "mobile" : "desktop";

function applyTheme(){
  if (!TH) return;
  const modo = vistaActual();
  const V = TH[modo] || TH.desktop || TH;         // compatible con el formato anterior
  const M = (MED && (MED[modo] || MED.desktop)) || {};
  const logoSrc = (MED && MED.logo) || TH.logo || "";
  const bgSrc   = M.bgImage || V.bgImage || "";
  const srcDe   = id => {
    const b = (M.boxes || []).find(x => x.id === id);
    return b ? b.src : null;
  };
  const DIM = modo === "mobile" ? {w:620,h:1100} : {w:1180,h:660};

  if (V.bgType === "image" && bgSrc){
    $("bg").src = bgSrc; $("bg").style.display = "block";
    $("bg").style.filter = `opacity(${V.bgOpacity??100}%) brightness(${V.bgBrightness??100}%)`;
    document.body.style.background = "#0e0f18";
  } else {
    $("bg").style.display = "none";
    document.body.style.background = V.bgType === "gradient"
      ? `linear-gradient(${V.bgDir||"to right"}, ${V.bgColor1||"#161826"}, ${V.bgColor2||"#2b2741"})`
      : (V.bgColor1 || "#161826");
  }

  if (logoSrc){ $("logo").src = logoSrc; $("logo").style.display = "block"; }
  else $("logo").style.display = "none";
  // Acá NO va pintarCabecera(): applyTheme corre al evaluar el módulo, antes de
  // que se declare P, y leerlo ahí revienta por zona muerta. El logo lo pone el
  // tema y el texto lo ponen los emparejamientos; son independientes.
  $("names").style.display = "none";

  document.querySelectorAll(".imgbox").forEach(e => e.remove());
  (V.boxes || V.imgBoxes || []).forEach(box => {
    const src = box.src || srcDe(box.id);
    if (!src) return;
    const d = document.createElement("div"); d.className = "imgbox";
    d.style.left   = (box.x / DIM.w * 100) + "vw";
    d.style.top    = (box.y / DIM.h * 100) + "vh";
    d.style.width  = (box.w / DIM.w * 100) + "vw";
    d.style.height = (box.h / DIM.h * 100) + "vh";
    d.style.display = tab === "timer" ? "block" : "none";
    const im = document.createElement("img"); im.src = src;
    if (box.flip) im.style.transform = "scaleX(-1)";
    d.appendChild(im); document.body.appendChild(d);
  });
}
window.addEventListener("resize", () => { if (TH) applyTheme(); });
window.addEventListener("orientationchange", () => setTimeout(() => { if (TH) applyTheme(); }, 300));

// Si había respaldo, la vista aparece de inmediato sin esperar a la red
if (TH) applyTheme();
dibujarReloj();

/* =========================================================
   7. Emparejamientos
   ========================================================= */
let P = null, sel = null, showStand = false, seenStamp = 0, first = true;

function limpiarPair(msg){
  $("tname").textContent = "Mesas";
  $("tsub").textContent  = "";
  $("banner").style.display = "none";
  $("rounds").innerHTML = "";
  $("list").innerHTML   = "";
  $("q").value = "";
  sel = null; showStand = false; first = true;
  $("dot").style.visibility = "hidden";
  $("pstatus").textContent = msg;
}

onValue(ref(db, BASE + "/pairings"), snap => {
  P = snap.val();
  // El organizador borró lo publicado: hay que limpiar lo que quedó en pantalla,
  // si no los nombres siguen visibles aunque ya no existan en Firebase.
  if (!P || !P.rounds || !P.rounds.length){
    P = null;
    limpiarPair("Aún no hay emparejamientos publicados.");
    pintarCabecera();
    return;
  }
  $("pstatus").textContent = "";
  const lastNum = P.rounds[P.rounds.length-1].number;
  if (sel === null || sel < lastNum) sel = lastNum;
  if (!first && tab !== "pair" && P.updatedAt > seenStamp) $("dot").style.visibility = "visible";
  first = false;
  pintarCabecera();
  renderPair();
}, () => $("pstatus").textContent = "Sin conexión — reintentando…");

/* El nombre del torneo y la ronda vienen en el mismo paquete de
   emparejamientos que ya se estaba escuchando, así que no cuesta nada más. Si
   no hay nada publicado, la cabecera queda con el logo solo. */
function pintarCabecera(){
  const t = $("ctitulo"), sub = $("csub"), ro = $("pronda");
  if (!P || !P.rounds || !P.rounds.length){
    t.textContent = ""; sub.textContent = ""; ro.style.display = "none"; return;
  }
  const deN = P.rondasTotales ? " de " + P.rondasTotales : "";
  t.textContent = P.name || "";
  sub.textContent = "Ronda " + P.lastRound + deN +
    (P.roundtime ? " · rondas de " + P.roundtime + " min" : "");
  ro.textContent = "Ronda " + P.lastRound + deN +
    (P.phase === "results" ? " · resultados" : " · en curso");
  ro.style.display = "block";
}

$("q").oninput = renderPair;

function renderPair(){
  if (!P) return;
  $("tname").textContent = P.name;
  $("tsub").textContent = (P.roundtime ? "Rondas de "+P.roundtime+" min · " : "") +
    "Actualizado " + new Date(P.updatedAt).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});

  const b = $("banner");
  if (P.phase === "results"){
    b.style.display = "block";
    b.textContent = "Resultados de la ronda "+P.lastRound+" publicados. Revisa que el tuyo esté correcto y avisa al juez si hay algún error.";
  } else if (P.phase === "paired"){
    b.style.display = "block";
    b.textContent = "Ronda "+P.lastRound+" emparejada. Busca tu mesa.";
  } else b.style.display = "none";

  const rb = $("rounds"); rb.innerHTML = "";
  P.rounds.forEach(r => {
    const btn = document.createElement("button");
    btn.textContent = "R"+r.number;
    btn.className = (!showStand && sel===r.number) ? "on" : "";
    btn.onclick = () => { sel=r.number; showStand=false; renderPair(); };
    rb.appendChild(btn);
  });
  if (P.standings?.length){
    const btn = document.createElement("button");
    btn.textContent = "Posiciones"; btn.className = showStand ? "on" : "";
    btn.onclick = () => { showStand=true; renderPair(); };
    rb.appendChild(btn);
  }

  const list = $("list"); list.innerHTML = "";
  list.className = showStand ? "" : "mesas";   // la rejilla es solo para las mesas
  const q = $("q").value.trim().toLowerCase();

  if (showStand){
    let h = '<div class="secLabel">POSICIONES FINALES</div>';
    P.standings.forEach(s => {
      const hit = q && s.name.toLowerCase().includes(q);
      const medalla = s.place <= 3 ? " pod"+s.place : "";
      h += `<div class="frow${hit?" hlrow":""}"${q&&!hit?' style="opacity:.35"':''}>
              <span class="fpos${medalla}">${s.place}</span>
              <div class="fmid"><div class="fname">${esc(s.name)}</div>
                <div class="fmeta">${s.w}-${s.l}-${s.t}${pctTxt(s)}</div></div>
              <span class="fpts">${s.pts}</span>
            </div>`;
    });
    list.innerHTML = h;
    return;
  }

  const round = P.rounds.find(r => r.number === sel);
  const ms = round?.matches || [];
  let mostradas = 0;
  ms.forEach(m => {
    const hit = q && (m.p1.toLowerCase().includes(q) || (m.p2||"").toLowerCase().includes(q));
    if (q && !hit) return;                        // con búsqueda activa se ocultan las demás
    mostradas++;
    const d = document.createElement("div"); d.className = "match";
    if (hit) d.classList.add("hl");

    // Quién ganó, para marcarlo en su fila
    const g1  = m.result && m.p1 && m.result === "Gana " + m.p1;
    const g2  = m.result && m.p2 && m.result === "Gana " + m.p2;
    const emp = m.result === "Empate";

    const fila = (n, r, gana) => {
      if (!n) return "";
      const marca = gana ? '<span class="win">GANA</span>'
                  : (emp ? '<span class="tie">EMPATE</span>' : "");
      return `<div class="prow${gana?" won":""}">
                <div class="pinfo"><div class="pname">${esc(n)}</div>
                  <div class="pmeta">${r ? r.w+"-"+r.l+"-"+r.t+" · "+r.pts+" pts"+pctTxt(r) : ""}</div></div>
                ${marca}</div>`;
    };

    d.innerHTML = `
      <div class="mnum"><span class="mlbl">MESA</span><span class="mval">${m.p2 ? m.table : "—"}</span></div>
      <div class="mbody">
        ${fila(m.p1, m.p1rec, g1)}
        ${m.p2 ? fila(m.p2, m.p2rec, g2)
               : '<div class="byetag"><b>BYE</b> descansa esta ronda</div>'}
      </div>`;
    list.appendChild(d);
  });

  if (q && !mostradas){
    list.className = "";                       // el aviso ocupa el ancho completo
    list.innerHTML = '<div class="vacio"><b>Sin coincidencias</b>'
      + '<div>Prueba con tu apellido o borra la búsqueda.</div></div>';
  }
}

/* =========================================================
   8. Clasificación mensual
   El historial puede crecer bastante, así que se descarga recién cuando
   alguien abre la pestaña, no al entrar a la página.
   ========================================================= */
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio",
               "agosto","septiembre","octubre","noviembre","diciembre"];
function nombreMes(m){
  const [a,mm] = m.split("-");
  return MESES[parseInt(mm,10)-1] + " " + a;
}

let HIST = null, CFG = { puntos:[12,10,8,7,6,5,4,3], resto:1 }, mesSel = null, histOn = false;

function suscribirHistorial(){
  if (histOn) return;
  histOn = true;
  onValue(ref(db, BASE + "/config"), snap => {
    const v = snap.val();
    if (v && Array.isArray(v.puntos)) CFG = { puntos: v.puntos, resto: v.resto ?? 1 };
    renderClas();
  });
  onValue(ref(db, BASE + "/historial"), snap => { HIST = snap.val() || {}; renderClas(); },
          () => { $("cstatus").textContent = "No se pudo cargar la clasificación."; });
}

function puntosPorPuesto(place){
  const p = CFG.puntos;
  return (place >= 1 && place <= p.length) ? p[place-1] : (CFG.resto || 0);
}

$("mes").onchange = e => { mesSel = e.target.value; renderClas(true); };

/* El podio repite a los tres primeros que ya están en la tabla de abajo. No
   es información nueva: es para que se vea de un vistazo quién va ganando el
   mes, que es lo que el jugador viene a mirar. */
function pintarPodio(filas){
  const caja = $("podio");
  if (filas.length < 3){ caja.className = "hide"; caja.innerHTML = ""; return; }
  caja.className = "";
  const orden = [filas[1], filas[0], filas[2]];       // en pantalla: 2 · 1 · 3
  const puesto = [2, 1, 3];
  caja.innerHTML = orden.map((r, i) =>
    '<div class="pod p' + puesto[i] + '">' +
      '<div class="podNom">' + esc(r.name) + '</div>' +
      '<div class="podPts">' + r.pts + ' pts</div>' +
      '<div class="podCaja">' + puesto[i] + '</div>' +
    '</div>').join("");
}

function renderClas(soloTabla){
  if (!HIST) return;
  const torneos = Object.values(HIST);
  if (!torneos.length){
    $("clasBox").innerHTML = "";
    $("podio").className = "hide";
    $("cstatus").textContent = "Todavía no hay torneos archivados.";
    $("mes").style.display = "none";
    return;
  }
  $("mes").style.display = "";

  const meses = [...new Set(torneos.map(t => t.mes))].sort().reverse();
  if (!mesSel || !meses.includes(mesSel)) mesSel = meses[0];
  if (!soloTabla){
    $("mes").innerHTML = meses.map(m =>
      '<option value="'+m+'"'+(m===mesSel?' selected':'')+'>'+nombreMes(m)+'</option>').join("");
  }

  const delMes = torneos.filter(t => t.mes === mesSel);
  const tabla = {};
  delMes.forEach(t => (t.standings||[]).forEach(p => {
    const k = p.name;
    if (!tabla[k]) tabla[k] = { name:p.name, pts:0, torneos:0, mejor:99, w:0, l:0, e:0 };
    const r = tabla[k];
    r.pts += puntosPorPuesto(p.place);
    r.torneos++;
    r.mejor = Math.min(r.mejor, p.place);
    r.w += p.w||0; r.l += p.l||0; r.e += p.t||0;
  }));

  const filas = Object.values(tabla)
    .sort((a,b) => b.pts - a.pts || a.mejor - b.mejor || b.w - a.w || a.name.localeCompare(b.name));

  /* Porcentaje de victorias del mes: se suman TODAS las partidas de todos los
     torneos y se divide una sola vez. Así un torneo de 7 rondas pesa más que
     uno de 3, que es lo justo. El empate vale media victoria. */
  filas.forEach(r => {
    const jugadas = r.w + r.l + r.e;
    r.jugadas = jugadas;
    r.wr = jugadas ? ((r.w + r.e/2) / jugadas * 100) : null;
  });

  pintarPodio(filas);

  let h = '<div class="sub" style="margin-bottom:10px">' + delMes.length +
          (delMes.length === 1 ? ' torneo' : ' torneos') + ' en ' + nombreMes(mesSel) + '</div>';
  h += '<div class="chead"><span>JUGADOR</span><span>PUNTOS</span></div>';
  filas.forEach((r,i) => {
    const pos = i+1, medalla = pos <= 3 ? " pod"+pos : "";
    h += `<div class="crow" data-i="${i}">
            <span class="fpos${medalla}">${pos}</span>
            <div class="fmid"><div class="fname">${esc(r.name)}</div>
              <div class="fmeta">${r.torneos} ${r.torneos===1?'torneo':'torneos'}`
       + (r.wr===null ? '' : ' · ' + r.wr.toFixed(0) + '% vict.') + `</div></div>
            <span class="fpts">${r.pts}</span>
          </div>
          <div class="cdet" data-d="${i}">
            <div><span>TORNEOS</span><b>${r.torneos}</b></div>
            <div><span>MEJOR PUESTO</span><b class="ac">${r.mejor}º</b></div>
            <div><span>RÉCORD</span><b>${r.w}-${r.l}-${r.e}</b></div>
          </div>`;
  });
  h += '<div class="chint">Toca una fila para ver el detalle.</div>';
  $("clasBox").innerHTML = h;

  // Tocar una fila despliega su detalle y cierra el anterior
  $("clasBox").querySelectorAll(".crow").forEach(row => {
    row.onclick = () => {
      const i = row.dataset.i;
      const det = $("clasBox").querySelector('.cdet[data-d="'+i+'"]');
      const abierto = det.classList.contains("open");
      $("clasBox").querySelectorAll(".cdet.open").forEach(e => e.classList.remove("open"));
      $("clasBox").querySelectorAll(".crow.sel").forEach(e => e.classList.remove("sel"));
      if (!abierto){ det.classList.add("open"); row.classList.add("sel"); }
    };
  });
  $("cstatus").textContent = "";
}

/* =========================================================
   9. Ruleta de sorteos
   El organizador publica el giro con la hora exacta de partida, el ángulo
   inicial y el final. Cada teléfono anima ESE mismo giro con la hora del
   servidor, así todos ven la rueda frenar en el mismo nombre al mismo tiempo.
   ========================================================= */
const TAU = Math.PI * 2;
const COLORES_RULETA = ["#9184d9","#5aa8e0","#7fd98a","#e0a95a","#d97f9c",
                        "#8ad9d0","#c98be0","#b0b4c6"];
const norm = a => ((a % TAU) + TAU) % TAU;
const easeOut = t => 1 - Math.pow(1 - t, 4);

function dibujarRueda(cv, items, rot){
  const ctx = cv.getContext("2d");
  const R = cv.width/2, cx = R, cy = R, N = items.length;
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!N) return;

  const seg = TAU / N;
  const fuente = Math.max(10, Math.min(20, 460/N));
  for (let i = 0; i < N; i++){
    const a0 = rot + i*seg;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R-4, a0, a0+seg);
    ctx.closePath();
    ctx.fillStyle = COLORES_RULETA[i % COLORES_RULETA.length];
    ctx.fill();
    ctx.strokeStyle = "rgba(14,15,24,.5)"; ctx.lineWidth = 2; ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a0 + seg/2);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#12131c";
    ctx.font = "600 " + fuente + "px Inter, system-ui, sans-serif";
    const txt = items[i].length > 22 ? items[i].slice(0,21) + "…" : items[i];
    ctx.fillText(txt, R - 16, 0);
    ctx.restore();
  }

  ctx.beginPath(); ctx.arc(cx, cy, R*0.13, 0, TAU);
  ctx.fillStyle = "#0e0f18"; ctx.fill();
  ctx.strokeStyle = "rgba(233,233,237,.28)"; ctx.lineWidth = 2; ctx.stroke();
}

let SORT = null, giroId = null, animando = false, rotActual = 0;

onValue(ref(db, BASE + "/sorteo"), snap => {
  SORT = snap.val();
  arrancarGiro();
  pintarRuleta();
});

function arrancarGiro(){
  const g = SORT?.giro;
  if (!g || !g.id || g.id === giroId) return;
  giroId = g.id;

  // Quien abre la página después de que la rueda ya paró no ve el giro de
  // nuevo: aparece directamente frenada en el ganador.
  if (ahora() > g.startAt + g.dur){ animando = false; rotActual = g.to; return; }

  animando = true;
  const fin = () => { animando = false; rotActual = g.to; pintarRuleta(); };
  const paso = () => {
    if (!animando) return;
    const t = Math.min(1, Math.max(0, (ahora() - g.startAt) / g.dur));
    rotActual = g.from + (g.to - g.from) * easeOut(t);
    pintarRuleta();
    if (t < 1) requestAnimationFrame(paso); else fin();
  };
  requestAnimationFrame(paso);
  // Red de seguridad: si el navegador congela los frames, la rueda igual
  // termina en el nombre correcto en vez de quedarse a medio girar.
  setTimeout(() => { if (animando) fin(); },
             Math.max(0, g.startAt - ahora()) + g.dur + 600);
}

function pintarRuleta(){
  if (tab !== "sorteo") return;

  // Mientras haya un giro publicado se dibuja la rueda tal como estaba en ese
  // giro, para que la flecha siga apuntando al ganador que todos vieron salir.
  const g  = SORT?.giro;
  const gs = SORT?.ganadores || [];
  const items = g?.items?.length ? g.items : (SORT?.items || []);

  // La pestaña está siempre a la vista, así que cuando el organizador todavía
  // no prepara nada hay que decirlo con todas sus letras en vez de dejar un
  // círculo vacío que parece que se rompió algo.
  const vacio = !items.length && !gs.length;
  $("rVacio").style.display  = vacio ? "" : "none";
  $("rWrap").style.display   = vacio ? "none" : "";
  $("rWinner").style.display = vacio ? "none" : "";
  if (vacio){
    $("rTitle").textContent = "Sorteo";
    $("rList").innerHTML = "";
    $("sstatus").textContent = "";
    return;
  }

  $("rTitle").textContent = SORT?.titulo || "Sorteo";
  dibujarRueda($("rCanvas"), items, rotActual);

  const w = $("rWinner");
  if (animando)          w.innerHTML = '<div class="lbl">GIRANDO…</div>';
  else if (g?.ganador)   w.innerHTML = '<div class="lbl">GANADOR</div><div class="who">' + esc(g.ganador) + '</div>';
  else                   w.innerHTML = '<div class="lbl">LISTO PARA GIRAR</div>';

  $("rList").innerHTML = gs.length
    ? '<div class="secLabel">GANADORES</div>' + gs.map((x,i) =>
        `<div class="frow"><span class="fpos">${i+1}</span>
           <div class="fmid"><div class="fname">${esc(x.nombre)}</div></div></div>`).join("")
    : "";

  const quedan = (SORT?.items || []).length;
  $("sstatus").textContent = quedan
    ? quedan + (quedan === 1 ? " participante en la rueda" : " participantes en la rueda")
    : "Ya salieron todos los premios.";
}

window.addEventListener("resize", () => { if (tab === "sorteo") pintarRuleta(); });
/* =========================================================
   10. Agenda de torneos
   El organizador publica las fechas desde su panel; acá solo se muestran y se
   ofrecen dos salidas: el enlace de Google Calendar (que la app del celular
   abre sola) y un .ics para iPhone, Outlook y el resto.
   ========================================================= */
const MES_CORTO = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
let AG = null, agendaOn = false, mesVista = null;

function suscribirAgenda(){
  if (agendaOn) return;
  agendaOn = true;
  onValue(ref(db, BASE + "/agenda"), snap => {
    const v = snap.val() || {};
    AG = ordenar(Object.entries(v).map(([id, e]) => ({ id, ...e })));
    renderAgenda();
  }, () => { $("astatus").textContent = "No se pudo cargar la agenda."; });
}

function tarjeta(ev, esProximo){
  const [, m, d] = (ev.fecha || "").split("-");
  const card = document.createElement("div");
  card.className = "evCard" + (esProximo ? " prox" : "");
  card.dataset.ev = ev.id;
  card.innerHTML =
    '<div class="evCal"><div class="d">' + (+d) + '</div><div class="m">' + MES_CORTO[+m-1] + '</div></div>' +
    '<div class="evBody">' +
      '<div class="evTit">' + esc(ev.titulo) + '</div>' +
      '<div class="evCuando">' + esc(fechaLegible(ev.fecha)) +
        (ev.hora ? " · " + esc(ev.hora) + " h" : " · todo el día") +
        (ev.lugar ? "<br>" + esc(ev.lugar) : "") + "</div>" +
      '<span class="evFalta">' + esc(cuantoFalta(ev)) + "</span>" +
      (ev.detalle ? '<div class="evDet">' + esc(ev.detalle) + "</div>" : "") +
      '<div class="evBtns"></div>' +
    "</div>";

  const btns = card.querySelector(".evBtns");
  const g = document.createElement("a");
  g.className = "gcal"; g.href = urlGoogle(ev);
  g.target = "_blank"; g.rel = "noopener";
  g.textContent = "Agregar a Google Calendar";
  btns.appendChild(g);

  const i = document.createElement("button");
  i.textContent = "Otro calendario (.ics)";
  i.onclick = () => bajarIcs([ev], (ev.titulo || "torneo").toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40) + ".ics");
  btns.appendChild(i);

  return card;
}

/* La rejilla es solo de lectura: el jugador no agenda nada. Tocar un evento lo
   lleva a su tarjeta, que es donde están los botones de Google Calendar. */
function renderMes(){
  if (!mesVista) mesVista = mesDeInteres(AG || []);
  $("calMes").textContent = MES_LARGO[mesVista.m] + " " + mesVista.a;

  if (!$("calDows").childElementCount){
    DOWS.forEach(d => {
      const c = document.createElement("div"); c.className = "calDow"; c.textContent = d;
      $("calDows").appendChild(c);
    });
  }

  const porDia = porFecha(AG || []);
  const g = $("calGrid"); g.innerHTML = "";

  celdasDelMes(mesVista.a, mesVista.m).forEach(c => {
    const cel = document.createElement("div");
    cel.className = "calDia" + (c.fuera ? " fuera" : "") + (c.hoy ? " hoy" : "");

    const num = document.createElement("div");
    num.className = "calNum"; num.textContent = c.dia;
    cel.appendChild(num);

    (porDia[c.iso] || []).forEach(ev => {
      const chip = document.createElement("div");
      chip.className = "calEv" + (estaVigente(ev) ? "" : " pasado");
      chip.textContent = ev.hora || "todo el día";
      chip.title = ev.titulo;
      chip.onclick = () => irATarjeta(ev);
      cel.appendChild(chip);
    });

    g.appendChild(cel);
  });
}

function irMes(delta){ mesVista = mesDesplazado(mesVista.a, mesVista.m, delta); renderMes(); }
$("calAnt").onclick = () => irMes(-1);
$("calSig").onclick = () => irMes(1);
$("calHoy").onclick = () => { const h = new Date(); mesVista = { a:h.getFullYear(), m:h.getMonth() }; renderMes(); };

/* Toca un evento de la rejilla: baja a su tarjeta y la resalta un momento. Si
   ya pasó no tiene tarjeta —la lista solo muestra los próximos—, así que ahí
   se avisa en vez de hacer nada. */
function irATarjeta(ev){
  const card = $("aLista").querySelector('[data-ev="' + ev.id + '"]');
  if (!card){
    $("astatus").textContent = "«" + ev.titulo + "» ya pasó.";
    setTimeout(() => { $("astatus").textContent = ""; }, 2500);
    return;
  }
  card.scrollIntoView({ behavior:"smooth", block:"center" });
  card.classList.add("destacada");
  setTimeout(() => card.classList.remove("destacada"), 1600);
}

function renderAgenda(){
  if (!AG) return;
  renderMes();
  $("calCaja").style.display = AG.length ? "block" : "none";
  const futuros = AG.filter(e => estaVigente(e));
  $("aVacio").style.display = futuros.length ? "none" : "block";
  $("astatus").textContent = "";
  const lista = $("aLista"); lista.innerHTML = "";
  futuros.forEach((e, i) => lista.appendChild(tarjeta(e, i === 0)));
  if (futuros.length > 1){
    const todos = document.createElement("div");
    todos.className = "evBtns";
    todos.style.justifyContent = "center";
    const b = document.createElement("button");
    b.textContent = "Descargar las " + futuros.length + " fechas (.ics)";
    b.onclick = () => bajarIcs(futuros, "torneos.ics", "Torneos");
    todos.appendChild(b);
    lista.appendChild(todos);
  }
}

/* "en 3 días" envejece solo: si alguien deja la página abierta toda la noche,
   al otro día tiene que decir "mañana" y no seguir diciendo "en 2 días". */
setInterval(() => { if (tab === "agenda" && AG) renderAgenda(); }, 60000);
</script>
